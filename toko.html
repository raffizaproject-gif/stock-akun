<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00754a">
<title>VIXZAA AM PREMIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#16211d;--mut:#6b7873;--line:#e2e9e6;--g:#00754a;--gh:#005f3c;--gs:#e4f3ec;--chip:#eaf0ed;--danger:#c8372d;--dsoft:#fdeceb;--hd:rgba(255,255,255,.92);color-scheme:light;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1714;--card:#17231f;--ink:#e8f0ed;--mut:#93a39c;--line:#26362f;--g:#2fb783;--gh:#46c897;--gs:#173a2e;--chip:#22332d;--danger:#ff7a70;--dsoft:#3a1c1a;--hd:rgba(14,23,20,.92);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1714;--card:#17231f;--ink:#e8f0ed;--mut:#93a39c;--line:#26362f;--g:#2fb783;--gh:#46c897;--gs:#173a2e;--chip:#22332d;--danger:#ff7a70;--dsoft:#3a1c1a;--hd:rgba(14,23,20,.92);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid rgba(0,117,74,.4);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* header */
.hd{position:sticky;top:0;z-index:20;background:var(--hd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd .wrap{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;white-space:nowrap;flex:none}
.logo{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}
.srch{flex:1;max-width:380px;margin-left:auto;position:relative;min-width:0}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut)}
.srch input{width:100%;height:42px;border:1px solid var(--line);border-radius:30px;background:var(--card);padding:0 16px 0 38px;font-size:.9rem}
.srch input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(0,117,74,.15)}
.srch input::placeholder{color:var(--mut)}
.icon-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--chip)}
/* konten */
main{padding-top:18px;padding-bottom:36px}
.bn{position:relative;border-radius:18px;overflow:hidden;background:var(--chip);aspect-ratio:21/8;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.bn-track{display:flex;height:100%;transition:transform .5s ease}
.bn-s{flex:0 0 100%;height:100%;display:block}
.bn-s img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.bn-ph{height:100%;display:flex;flex-direction:column;justify-content:center;gap:6px;background:linear-gradient(120deg,#1e3932,var(--g));color:#fff;padding:0 7%}
.bn-ph b{font-weight:800;font-size:clamp(1.3rem,4.6vw,2.6rem);letter-spacing:-.04em;line-height:1.05}
.bn-ph span{opacity:.88;font-size:clamp(.78rem,2vw,1rem)}
.bn-a{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);color:#16211d;display:grid;place-items:center}
.bn-a.l{left:12px}.bn-a.r{right:12px}
.bn-d{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.bn-d i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.65);cursor:pointer;transition:.25s}
.bn-d i.on{background:#fff;width:20px;border-radius:4px}
.trust{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin:16px 0 8px;font-size:.8rem;font-weight:600;color:var(--mut)}
.trust span{display:flex;align-items:center;gap:6px}
.trust svg{width:16px;height:16px;color:var(--g)}
.sh{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sh h2{font-weight:800;font-size:1.4rem;letter-spacing:-.03em}
.cnt{font-size:.82rem;color:var(--mut);font-weight:600}
.notice{background:var(--dsoft);color:var(--danger);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:.88rem}
/* produk */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(0,60,40,.35)}
.card.in{animation:up .5s ease var(--d,0s) backwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ph{position:relative;aspect-ratio:4/3;background:var(--gs);color:var(--g);display:grid;place-items:center;font-weight:800;font-size:2.6rem;cursor:pointer;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .ph img{transform:scale(1.04)}
.bd{position:absolute;top:10px;left:10px;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.95);color:var(--g)}
.bd.out{background:var(--danger);color:#fff}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:700;font-size:1rem;line-height:1.3;cursor:pointer;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds{font-size:.82rem;color:var(--mut);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pr{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:var(--g);margin-top:auto;padding-top:4px}
.buy{height:44px;border-radius:30px;background:var(--g);color:#fff;font-weight:700;font-size:.9rem;width:100%;margin-top:6px;transition:background .15s,transform .15s}
.buy:hover:not(:disabled){background:var(--gh)}
.buy:active:not(:disabled){transform:scale(.98)}
.buy:disabled{background:var(--chip);color:var(--mut);cursor:not-allowed}
.sk{pointer-events:none}
.sk .ph,.sk i{background:linear-gradient(90deg,var(--chip) 25%,var(--line) 50%,var(--chip) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk i{display:block;height:14px;border-radius:7px;margin:6px 14px}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;padding:50px 12px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:10px 0 28px}
/* detail */
.ov{position:fixed;inset:0;background:rgba(8,20,16,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;overscroll-behavior:contain}
.ov.show{display:flex}
.dlg{background:var(--card);border-radius:22px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow:auto;animation:up .25s ease}
.dm{position:relative;background:var(--gs);color:var(--g);display:grid;place-items:center;font-weight:800;font-size:3rem;min-height:160px}
.dm img{display:block;width:100%;max-height:min(52vh,420px);object-fit:contain}
.dp{padding:18px;display:grid;gap:12px}
.dp h2{font-weight:800;font-size:1.35rem;letter-spacing:-.03em;overflow-wrap:anywhere}
.dp .full{white-space:pre-wrap;color:var(--mut);font-size:.92rem;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;font-size:1.4rem;color:var(--g)}
.chip{font-size:.75rem;font-weight:700;border-radius:20px;padding:3px 11px;background:var(--chip);color:var(--mut)}
.chip.ok{background:var(--gs);color:var(--g)}
.chip.out{background:var(--dsoft);color:var(--danger)}
.btn2{height:44px;border-radius:30px;border:1px solid var(--line);font-weight:600;width:100%}
.btn2:hover{background:var(--chip)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#16211d;color:#fff;padding:10px 18px;border-radius:30px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.wrap{padding:0 12px}.brand span{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.cb{padding:10px}.nm{font-size:.9rem}.ds{display:none}.pr{font-size:1.05rem}.buy{height:40px;font-size:.82rem}.bn{border-radius:14px;aspect-ratio:16/8}.bn-a{display:none}.ph{font-size:2rem}.sh h2{font-size:1.2rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hd"><div class="wrap">
  <a class="brand" href="./"><div class="logo">V</div><span>VIXZAA AM PREMIUM</span></a>
  <div class="srch"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" id="q" placeholder="Cari produk..." autocomplete="off" aria-label="Cari produk"></div>
  <button class="icon-btn" id="btn-theme" aria-label="Ganti tema"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></header>

<main class="wrap">
  <div class="bn" id="bn"></div>
  <div class="trust">
    <span><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Transaksi aman</span>
    <span><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Garansi produk</span>
    <span><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Proses cepat</span>
  </div>
  <div id="notice" class="notice hidden"></div>
  <div class="sh"><h2>Produk</h2><span class="cnt" id="cnt"></span></div>
  <div class="grid" id="grid"></div>
</main>
<footer>&copy; <span id="yr"></span> VIXZAA AM PREMIUM</footer>

<div class="ov" id="ov"><div class="dlg" id="detail"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
/* ===== Firebase: sama dengan web stok ===== */
const firebaseConfig={apiKey:"AIzaSyD9kvXX9CDlBjbZ8BD6nrPCv7d8r46s7aI",authDomain:"stock-akun-4c073.firebaseapp.com",projectId:"stock-akun-4c073",storageBucket:"stock-akun-4c073.firebasestorage.app"};
const FB="10.12.2";
/* ========================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp"+Number(n||0).toLocaleString("id-ID");
const fixLink=l=>{l=(l||"").trim();return l&&!/^https?:\/\//i.test(l)?"https://"+l:l};
let products=[],banners=[],stock=null,term="",loaded=false,anim=true,bi=0,bt=null;
$("yr").textContent=new Date().getFullYear();
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function notice(m){const n=$("notice");n.textContent=m;n.classList.toggle("hidden",!m)}
/* tema */
const th=store.get("vx.theme");if(th)document.documentElement.dataset.theme=th;
$("btn-theme").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";store.set("vx.theme",d.dataset.theme)};
/* stok */
function stockOf(p){
  if(p.stockType==="manual")return Math.max(0,parseInt(p.stockManual)||0);
  return stock&&typeof stock[p.stockType]==="number"?stock[p.stockType]:null}
const noBuy=p=>stockOf(p)===0||!p.link;
const buyTxt=p=>stockOf(p)===0?"Stok habis":p.link?"Beli Sekarang":"Belum tersedia";
const initial=p=>esc((p.name||"?").trim().charAt(0).toUpperCase());
const photo=p=>p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" decoding="async" draggable="false" onerror="this.remove()">`:"";
const buy=p=>{const l=fixLink(p.link);if(l&&!noBuy(p))window.open(l,"_blank","noopener")};
/* daftar produk */
const card=(p,i)=>{const s=stockOf(p),id=esc(p.id);return`<article class="card${anim?" in":""}" style="--d:${(Math.min(i,10)*.05).toFixed(2)}s">
  <div class="ph" data-act="detail" data-id="${id}" role="button" tabindex="0" aria-label="Lihat ${esc(p.name)}">${initial(p)}${photo(p)}<span class="bd${s===0?" out":""}">${s===null?"Ready":s>0?"Stok "+s:"Habis"}</span></div>
  <div class="cb"><h3 class="nm" data-act="detail" data-id="${id}">${esc(p.name)}</h3><p class="ds">${esc(p.desc)}</p><div class="pr">${rp(p.price)}</div>
  <button class="buy" data-act="buy" data-id="${id}" ${noBuy(p)?"disabled":""}>${buyTxt(p)}</button></div></article>`};
const skel='<article class="card sk"><div class="ph"></div><i style="width:70%"></i><i style="width:40%"></i><i style="height:40px;border-radius:30px"></i></article>';
function render(){
  const g=$("grid");
  if(!loaded){g.innerHTML=skel.repeat(4);$("cnt").textContent="";return}
  const list=products.filter(p=>(p.name||"").toLowerCase().includes(term));
  $("cnt").textContent=list.length?list.length+" produk":"";
  g.innerHTML=list.length?list.map(card).join(""):`<div class="empty"><b>${products.length?"Produk tidak ditemukan":"Belum ada produk"}</b>${products.length?"Coba kata kunci lain.":"Silakan cek lagi nanti."}</div>`;
  if(list.length)anim=false}
$("q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();render()});
/* detail */
const openOv=()=>{$("ov").classList.add("show");document.body.style.overflow="hidden"};
const closeOv=()=>{$("ov").classList.remove("show");document.body.style.overflow=""};
function openDetail(p){
  const s=stockOf(p);
  $("detail").innerHTML=`<div class="dm">${initial(p)}${photo(p)}</div><div class="dp"><h2>${esc(p.name)}</h2>
  <div class="row"><span class="price">${rp(p.price)}</span><span class="chip ${s===null?"":s>0?"ok":"out"}">${s===null?"Ready":s>0?"Stok: "+s:"Stok habis"}</span></div>
  <div class="full">${esc(p.desc)||"Belum ada deskripsi."}</div>
  <button class="buy" id="d-buy" ${noBuy(p)?"disabled":""}>${buyTxt(p)}</button><button class="btn2" id="d-x">Tutup</button></div>`;
  $("d-buy").onclick=()=>buy(p);$("d-x").onclick=closeOv;openOv()}
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeOv()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeOv();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".ph[data-act]")){e.preventDefault();e.target.click()}});
$("grid").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const p=products.find(x=>x.id===b.dataset.id);if(!p)return;
  b.dataset.act==="buy"?buy(p):openDetail(p)});
/* banner */
function renderBanner(){
  clearInterval(bt);const el=$("bn");el.style.aspectRatio="";
  if(!banners.length){el.innerHTML='<div class="bn-ph"><b>VIXZAA<br>AM PREMIUM</b><span>Akun premium terpercaya, proses cepat</span></div>';return}
  const n=banners.length;
  el.innerHTML=`<div class="bn-track" id="bt">${banners.map(b=>{const l=fixLink(b.link);return`<${l?`a href="${esc(l)}" target="_blank" rel="noopener"`:"div"} class="bn-s"><img src="${esc(b.img)}" alt="Banner" draggable="false"></${l?"a":"div"}>`}).join("")}</div>`+
  (n>1?`<button class="bn-a l" data-d="-1" aria-label="Sebelumnya"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="bn-a r" data-d="1" aria-label="Berikutnya"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><div class="bn-d">${banners.map((_,i)=>`<i data-i="${i}"></i>`).join("")}</div>`:"");
  /* tinggi banner mengikuti rasio gambar pertama supaya tidak terpotong berlebihan */
  const im=el.querySelector("img"),fit=()=>{if(im.naturalWidth)el.style.aspectRatio=Math.min(3.2,Math.max(1.6,im.naturalWidth/im.naturalHeight)).toFixed(3)};
  im.complete?fit():im.addEventListener("load",fit);
  go(Math.min(bi,n-1));if(n>1)play()}
function go(i){const n=banners.length;if(!n)return;bi=(i+n)%n;const t=$("bt");if(t)t.style.transform=`translateX(-${bi*100}%)`;$("bn").querySelectorAll(".bn-d i").forEach((d,k)=>d.classList.toggle("on",k===bi))}
function play(){clearInterval(bt);bt=setInterval(()=>{if(!document.hidden)go(bi+1)},5000)}
let sx=null,moved=false;
$("bn").addEventListener("pointerdown",e=>{sx=e.clientX;moved=false});
$("bn").addEventListener("pointerup",e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40){moved=true;go(bi+(dx<0?1:-1));play()}});
$("bn").addEventListener("pointercancel",()=>{sx=null});
$("bn").addEventListener("click",e=>{
  if(moved){e.preventDefault();moved=false;return}
  const a=e.target.closest(".bn-a"),d=e.target.closest(".bn-d i");
  if(a){go(bi+Number(a.dataset.d));play()}else if(d){go(Number(d.dataset.i));play()}});
/* init */
render();renderBanner();
(async()=>{
  try{
    const b=`https://www.gstatic.com/firebasejs/${FB}/`;
    const [A,F]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-firestore.js")]);
    const db=F.getFirestore(A.initializeApp(firebaseConfig));
    const perm=e=>{loaded=true;notice(e&&e.code==="permission-denied"?"Akses ditolak. Atur Rules Firestore.":"Gagal memuat produk. Cek koneksi internet.");render()};
    F.onSnapshot(F.query(F.collection(db,"products"),F.orderBy("createdAt","desc")),s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;notice("");render()},perm);
    F.onSnapshot(F.query(F.collection(db,"banners"),F.orderBy("createdAt","asc")),s=>{banners=s.docs.map(d=>({id:d.id,...d.data()}));renderBanner()},()=>{});
    F.onSnapshot(F.doc(db,"public","stock"),s=>{stock=s.exists()?s.data():null;render()},()=>{});
  }catch(e){console.error(e);loaded=true;notice("Gagal memuat Firebase. Cek koneksi internet lalu muat ulang.");render()}
})();
</script>
</body>
</html>
